server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: aerosaga-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/aerosaga?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:aerosaga}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info
aerosaga:
  temporal:
    enabled: ${AEROSAGA_TEMPORAL_ENABLED:true}
    address: ${AEROSAGA_TEMPORAL_ADDRESS:localhost:7233}
    task-queue: ${AEROSAGA_TEMPORAL_TASK_QUEUE:AEROSAGA_MISSION_QUEUE}

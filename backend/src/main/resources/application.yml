server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: aerosaga-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:aerosaga;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
aerosaga:
  temporal:
    enabled: ${AEROSAGA_TEMPORAL_ENABLED:false}
    address: ${AEROSAGA_TEMPORAL_ADDRESS:localhost:7233}
    task-queue: ${AEROSAGA_TEMPORAL_TASK_QUEUE:AEROSAGA_MISSION_QUEUE}
